# Docker Compose Configuration
# 用法:
# 1. 复制 .env.example 为 .env 并配置
# 2. docker compose up -d

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
    container_name: fund-manager-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/fund_manager.db
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_DAYS=7
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://host.docker.internal:20263}
      - AUTH_SERVICE_JWKS_URL=${AUTH_SERVICE_JWKS_URL:-http://host.docker.internal:20263/.well-known/jwks.json}
      - AUTH_SERVICE_ISSUER=${AUTH_SERVICE_ISSUER:-http://localhost:20263}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-vestoria}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:20260}
      - REDIS_URL=redis://session-redis:6379/0
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-604800}
      - SESSION_COOKIE_PATH=${SESSION_COOKIE_PATH:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    networks:
      - fund-manager-network
      - compound-internal
    depends_on:
      session-redis:
        condition: service_healthy

  session-redis:
    image: redis:7-alpine
    container_name: fund-manager-session-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fund_session_data:/data
    networks:
      - fund-manager-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
        - VITE_AUTH_SERVICE_URL=${AUTH_SERVICE_PUBLIC_URL:-http://localhost:20263}
        - VITE_AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-vestoria}
    container_name: fund-manager-frontend
    restart: unless-stopped
    ports:
      - "20260:80"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - fund-manager-network
      - compound-edge

networks:
  fund-manager-network:
    driver: bridge
  compound-internal:
    name: compound-internal
    external: true
  compound-edge:
    name: compound-edge
    external: true

volumes:
  fund_session_data:
